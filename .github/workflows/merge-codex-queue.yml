---
name: merge-codex-queue
'on':
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-codex-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Merge codex-labeled PRs oldest to newest
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const core = require('@actions/core');

            const repo = context.repo;
            const base = 'main';

            const prs = await github.paginate(github.pulls.list, {
              owner: repo.owner,
              repo: repo.repo,
              base,
              state: 'open',
              sort: 'created',
              direction: 'asc',
              per_page: 100,
            });

            const queue = prs.filter((pr) =>
              pr.labels.some((label) => label.name === 'codex')
            );

            if (!queue.length) {
              core.info('No open codex-labeled PRs targeting main.');
              return;
            }

            for (const pr of queue) {
              core.startGroup(`Evaluating PR #${pr.number}: ${pr.title}`);

              if (pr.draft) {
                core.info('PR is draft; skipping.');
                core.endGroup();
                continue;
              }

              const prDetails = await github.pulls.get({
                owner: repo.owner,
                repo: repo.repo,
                pull_number: pr.number,
              });

              const mergeable = prDetails.data.mergeable;
              const mergeableState = prDetails.data.mergeable_state;

              if (!mergeable || mergeableState !== 'clean') {
                core.setFailed(
                  `PR #${pr.number} blocked queue (mergeable=${mergeable}, state=${mergeableState}).`
                );
                core.endGroup();
                return;
              }

              const headSha = pr.head.sha;

              const status = await github.repos.getCombinedStatusForRef({
                owner: repo.owner,
                repo: repo.repo,
                ref: headSha,
              });

              if (status.data.state !== 'success') {
                core.setFailed(
                  `PR #${pr.number} blocked queue (combined status=${status.data.state}).`
                );
                core.endGroup();
                return;
              }

              const checks = await github.checks.listForRef({
                owner: repo.owner,
                repo: repo.repo,
                ref: headSha,
              });

              const failingCheck = checks.data.check_runs.find(
                (run) => !['success', 'neutral', 'skipped'].includes(run.conclusion)
              );

              if (failingCheck) {
                core.setFailed(
                  `PR #${pr.number} blocked queue (check ${failingCheck.name} = ${failingCheck.conclusion}).`
                );
                core.endGroup();
                return;
              }

              const mergeTitle = `codex: ${pr.title}`;

              const mergeResult = await github.pulls.merge({
                owner: repo.owner,
                repo: repo.repo,
                pull_number: pr.number,
                merge_method: 'squash',
                commit_title: mergeTitle,
              });

              if (!mergeResult.data.merged) {
                core.setFailed(`Merge failed for PR #${pr.number}.`);
                core.endGroup();
                return;
              }

              if (pr.head.repo.full_name === `${repo.owner}/${repo.repo}`) {
                try {
                  await github.git.deleteRef({
                    owner: repo.owner,
                    repo: repo.repo,
                    ref: `heads/${pr.head.ref}`,
                  });
                  core.info(`Deleted branch ${pr.head.ref}.`);
                } catch (error) {
                  core.warning(
                    `Merged PR #${pr.number}, but failed to delete branch ${pr.head.ref}: ${error.message}`
                  );
                }
              } else {
                core.info('Branch not deleted (head repository is a fork).');
              }

              core.info(`Merged PR #${pr.number}.`);
              core.endGroup();
            }
